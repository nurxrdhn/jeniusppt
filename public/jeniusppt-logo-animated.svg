<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Logo animasi JeniusPPT</title>
  <desc id="desc">Monogram j dan P dengan simbol ide dan presentasi</desc>
  <style>
    .idea{transform-box:fill-box;transform-origin:center;animation:idea 2.4s ease-in-out infinite}
    .play{transform-box:fill-box;transform-origin:center;animation:play 2.4s ease-in-out infinite}
    @keyframes idea{0%,100%{opacity:.82;transform:scale(.94)}50%{opacity:1;transform:scale(1)}}
    @keyframes play{0%,55%,100%{transform:translateX(0)}70%{transform:translateX(3px)}}
    @media (prefers-reduced-motion:reduce){.idea,.play{animation:none}}
  </style>
  <rect width="512" height="512" rx="104" fill="#ff641e"/>
  <g class="idea" fill="#fff">
    <rect x="151" y="62" width="22" height="48" rx="11"/>
    <rect x="105" y="82" width="22" height="46" rx="11" transform="rotate(-45 116 105)"/>
    <rect x="197" y="82" width="22" height="46" rx="11" transform="rotate(45 208 105)"/>
    <circle cx="162" cy="154" r="34"/>
  </g>
  <path fill="#fff" d="M130 211h64v137c0 72-42 111-116 111H58v-62h18c36 0 54-17 54-52V211Z"/>
  <path fill="#fff" fill-rule="evenodd" d="M246 128h106a102 102 0 1 1 0 204h-42v127h-64V128Zm106 58a44 44 0 1 0 0 88 44 44 0 0 0 0-88Z"/>
  <g fill="#fff">
    <rect x="321" y="215" width="27" height="8" rx="4"/>
    <rect x="321" y="232" width="27" height="8" rx="4"/>
    <rect x="321" y="249" width="27" height="8" rx="4"/>
    <circle cx="380" cy="236" r="25"/>
  </g>
  <path class="play" fill="#ff641e" d="M374 223.5 393 236l-19 12.5v-25Z"/>
</svg>
